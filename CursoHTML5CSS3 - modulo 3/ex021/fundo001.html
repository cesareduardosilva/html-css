<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagem de fundo</title>
    <style>
        
        body {
            background-image: url('imagens/wallpaper002.jpg');
            width: 100%;
            height: 100%;
        }

        div.quadrado {
            width: 300px;
            height: 200px;
            border: 2px solid black;
            display: inline-block;
            border-radius: 10px;
        }

        div#img1 {
            background-color: aqua;
        }

        div#img2 {
            background-image: linear-gradient(to bottom, black, red);
        }

        div#img3 {
            background-image: url('imagens/pattern004.png');
        }

    </style>
</head>
<body>
    <div class="quadrado" id="img1">

    </div>
    <div class="quadrado" id="img2">
        
    </div>
    <div class="quadrado" id="img3">
        
    </div>
</body>
</html>
